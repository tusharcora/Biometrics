<html lang="en">
<head>

<title>Theme sets</title>

<x-dc>

.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244);text-decoration:none}
.ol{border-color:rgb(44,47,55);background:rgba(44,47,55,.3)}
.df{background:rgb(245,245,244);color:rgb(10,11,14)}
.label{font-family:'Silkscreen',monospace;font-size:11px;line-height:14px;letter-spacing:1px;text-transform:uppercase;color:rgb(245,245,244)}
.st{font-size:12px;line-height:17px;color:rgb(155,157,166)}
.stk{font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase}
.rm{width:390px;height:240px;border-radius:16px;overflow:hidden;border:1px solid rgb(36,39,46);box-sizing:border-box}
</style>
</helmet>
<div style="width: 1282px; height: 920px; box-sizing: border-box; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: baseline; gap: 16px">
    <h2 style="margin: 0; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 20px; letter-spacing: 1px">THEME SETS</h2>
    <span class="st" style="font-size: 13px">A set fills every slot in one tap, then each piece can still be swapped. Earning a set unlocks all its pieces. Rooms below use the catalogue items at room scale.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 24px">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: {{s.color}}"></span><span class="label">{{s.name}}</span></span>
        <div class="rm"><svg role="img" aria-label="{{s.aria}}" width="{{s.rm.w}}" height="{{s.rm.h}}" shape-rendering="crispEdges" style="display: block; margin: -1px"><sc-for list="{{s.rm.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg></div>
        <span class="st">{{s.items}}</span>
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="st" style="flex: 1"><span class="stk" style="color: {{s.sc}}">{{s.status}}</span> · {{s.unlock}}</span>
          <sc-if value="{{s.own}}" hint-placeholder-val="{{ false }}"><button class="b df" style="height: 36px; padding: 0 14px; font-size: 13px">Apply set</button></sc-if>
          <button class="b ol" style="height: 36px; padding: 0 12px; font-size: 13px">Preview</button>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
