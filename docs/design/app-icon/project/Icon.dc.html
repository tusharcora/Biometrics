<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KIP icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; border-radius: {{radius}}; overflow: hidden; flex: none; display: block; line-height: 0">
<svg width="{{size}}" height="{{size}}" viewBox="{{vb}}" shape-rendering="crispEdges" role="img" aria-label="{{label}}"><sc-for list="{{layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"concept":{"editor":"enum","default":"face","options":["face","stand","sleepy","weather","peek","pulse","battery","window","buddies","block","sprite","a_bg","a_fg","a_full","a_mono"]},"body":{"editor":"color","default":"#FB7185","options":["#FB7185","#3B82F6","#A3E635","#C4B5FD"]},"mood":{"editor":"enum","default":"idle","options":["idle","happy","sleepy","determined","crowned"]},"mode":{"editor":"enum","default":"full","options":["full","tinted"]},"tint":{"editor":"color","default":"#8EA7FF"},"mask":{"editor":"enum","default":"ios","options":["ios","none","circle","squircle","round"]},"size":{"editor":"int","default":192,"min":16,"max":1024},"$preview":{"width":192,"height":192}}'>
// ---- KIP engine (from character-canvas/scratch/kip-engine.js; basic GROUNDED block, no skin) ----
var N = 16;
var E = "................";
var BASE = [E, E, E, E, E, E,
  "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....",
  ".....b....s.....", ".....b....s.....", "...zzzzzzzzzz..."];
var EYES0 = [[6, 8], [9, 8]];
var SKINS = { plain: { label: "kip", body: "#FB7185", rows: {} } };
var COS = {
  "hat.crown": { slot: "head", front: { at: [4, 3], rows: ["y..yy..Y", "LyyyyyyY", "yryyyyrY"] }, pal: { y: "#FACC15", L: "#FDE68A", Y: "#CA8A04", r: "#EF4444" } }
};
var SLOTS = ["head", "face", "neck", "held", "back"];
var POSES = {
  rest: {},
  wave: { arms: [[12, 9, "s"], [13, 8, "s"]] },
  cheer: { arms: [[3, 9, "b"], [2, 8, "b"], [12, 9, "s"], [13, 8, "s"]], hop: 1 }
};
var MOODS = {
  idle: {},
  up: { eyes: "up" },
  blink: { eyes: "shut" },
  curious: { eyes: "up", tilt: 1 },
  sleepy: { eyes: "shut", squash: true },
  proud: { eyes: "up", tall: true },
  startled: { eyes: "wide", hop: 2 },
  glance: { eyes: "glance" },
  determined: { eyes: "shut", brows: true, tilt: -1 }
};
function rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function hx2(n) { var s = Math.max(0, Math.min(255, Math.round(n))).toString(16); return s.length < 2 ? "0" + s : s; }
function mix(a, b, k) { var x = rgb(a), y = rgb(b); return "#" + hx2(x[0] * (1 - k) + y[0] * k) + hx2(x[1] * (1 - k) + y[1] * k) + hx2(x[2] * (1 - k) + y[2] * k); }
function darken(a, k) { var x = rgb(a); return "#" + hx2(x[0] * k) + hx2(x[1] * k) + hx2(x[2] * k); }
function lum(h) { var c = rgb(h).map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function ramp(body) { return { b: body, h: mix(body, "#FFFFFF", 0.25), s: darken(body, 0.78), d: darken(body, 0.6), e: lum(body) > 0.2 ? "#14161B" : "#F5F5F4", w: "#F8FAFC", z: "rgba(0,0,0,0.35)" }; }
function blank() { var g = []; for (var i = 0; i < N; i++) { var r = []; for (var j = 0; j < N; j++) r.push(null); g.push(r); } return g; }
function put2(g, x, y, c) { if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c; }

function build(v) {
  var skin = SKINS[v.skin] || SKINS.plain;
  var body = v.body || skin.body;
  var p = ramp(body);
  var pose = POSES[v.pose] || POSES.rest;
  var mood = MOODS[v.mood] || MOODS.idle;
  var g = blank();
  function put(x, y, c) { if (x >= 0 && y >= 0 && x < N && y < N && c) g[y][x] = c; }
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var L = BASE[y][x]; if (L !== ".") put(x, y, L); }
  Object.keys(skin.rows).forEach(function (k) { var r = skin.rows[k]; for (var x2 = 0; x2 < N; x2++) if (r[x2] !== ".") put(x2, Number(k), r[x2]); });
  var eyes = (skin.eyes || EYES0).map(function (e) { return [e[0], e[1]]; });
  var eyeMode = pose.eyes || mood.eyes;
  var er = skin.eyeRole || "e";
  var cells = [];
  eyes.forEach(function (e, i) {
    if (eyeMode === "shut") { cells.push([e[0], e[1]]); cells.push([i === 0 ? e[0] - 1 : e[0] + 1, e[1]]); }
    else if (eyeMode === "up") cells.push([e[0], e[1] - 1]);
    else if (eyeMode === "wide") { cells.push([e[0], e[1]]); cells.push([e[0], e[1] - 1]); }
    else if (eyeMode === "glance") cells.push([e[0] + 1, e[1]]);
    else cells.push([e[0], e[1]]);
  });
  cells.forEach(function (c) { put(c[0], c[1], er); });
  if (mood.brows) eyes.forEach(function (e, i) { put(i === 0 ? e[0] + 1 : e[0] - 1, e[1] - 1, "d"); });
  var hop = pose.hop || mood.hop || 0;
  if (pose.tall || mood.tall) { var t = blank(); for (var y3 = 0; y3 < N; y3++) for (var x3 = 0; x3 < N; x3++) { var c3 = g[y3][x3]; if (!c3) continue; if (y3 <= 12 && c3 !== "z") { put2(t, x3, y3 - 1, c3); if (y3 === 12) put2(t, x3, 12, c3); } else put2(t, x3, y3, c3); } g = t; }
  if (mood.squash) { var q = blank(); for (var y4 = 0; y4 < N; y4++) for (var x4 = 0; x4 < N; x4++) { var c4 = g[y4][x4]; if (!c4 || y4 === 7) continue; put2(q, x4, y4 < 7 ? y4 + 1 : y4, c4); } for (var x5 = 2; x5 < 14; x5++) q[15][x5] = "z"; g = q; }
  if (mood.tilt) { var tl = blank(); for (var y8 = 0; y8 < N; y8++) for (var x8 = 0; x8 < N; x8++) { var c8 = g[y8][x8]; if (c8) put2(tl, x8 + (y8 < 9 ? mood.tilt : 0), y8, c8); } g = tl; }
  if (hop) { var hp = blank(); for (var y9 = 0; y9 < N; y9++) for (var x9 = 0; x9 < N; x9++) { var c9 = g[y9][x9]; if (!c9) continue; if (c9 === "z") continue; put2(hp, x9, y9 - hop, c9); } var sw = hop > 1 ? 6 : 8; for (var xa = 0; xa < sw; xa++) hp[15][8 - sw / 2 + xa] = "z"; g = hp; }
  (pose.arms || []).forEach(function (a) { var yy = a[1] - hop; if (yy >= 0 && !g[yy][a[0]]) g[yy][a[0]] = a[2]; });
  var out = blank();
  for (var yb = 0; yb < N; yb++) for (var xb = 0; xb < N; xb++) { var cb = g[yb][xb]; if (cb) out[yb][xb] = cb.charAt(0) === "#" || cb.indexOf("rgba") === 0 ? cb : p[cb]; }
  var ids = (v.cosmetics || []).slice();
  var list = ids.map(function (id) { return COS[id]; }).filter(Boolean);
  var shift = (skin.headTop != null ? skin.headTop : 6) - 6;
  function draw(it, part, layerBehind) {
    var q2 = it[part]; if (!q2) return;
    var dy = it.slot === "head" ? shift : 0;
    if (it.slot === "head") { if (q2.at[1] + dy < 0) return; }
    q2.rows.forEach(function (r, j) {
      for (var k = 0; k < r.length; k++) {
        var L2 = r[k]; if (L2 === ".") continue;
        var col = it.pal[L2]; if (col && col.charAt(0) === "@") col = p[col.slice(1)];
        var X = q2.at[0] + k, Y = q2.at[1] + j + dy;
        if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
        if (layerBehind) { if (!out[Y][X] || out[Y][X] === p.z) out[Y][X] = col; } else out[Y][X] = col;
      }
    });
  }
  list.forEach(function (it) { draw(it, "back", true); });
  SLOTS.forEach(function (slot) { list.forEach(function (it) { if (it.slot === slot) draw(it, "front", false); }); });
  return out;
}

// ---- icon canvas: a G x G grid of opaque cells, rgba composited onto what is below ----
var DARK = "#0A0B0E", CARD = "#14161B", CREAM = "#F4F2EE", SLATE = "#2A2F3A";
function grid(G, c) { var g = []; for (var y = 0; y < G; y++) { var r = []; for (var x = 0; x < G; x++) r.push(c || null); g.push(r); } return g; }
function onto(base, c) {
  if (c.indexOf("rgba") !== 0) return c;
  var m = c.match(/[\d.]+/g), a = Number(m[3]);
  var col = "#" + hx2(Number(m[0])) + hx2(Number(m[1])) + hx2(Number(m[2]));
  return base ? mix(base, col, a) : mix(DARK, col, a);
}
function px(g, x, y, c) { var G = g.length; if (c && x >= 0 && y >= 0 && x < G && y < G) g[y][x] = onto(g[y][x], c); }
function hole(g, x, y, w, h) { for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) { var Y = y + j, X = x + i; if (Y >= 0 && Y < g.length && X >= 0 && X < g.length) g[Y][X] = null; } }
function rect(g, x, y, w, h, c) { for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) px(g, x + i, y + j, c); }
function art(g, x, y, rows, pal) { rows.forEach(function (r, j) { for (var i = 0; i < r.length; i++) { var k = r[i]; if (k !== "." && pal[k]) px(g, x + i, y + j, pal[k]); } }); }
function bands(g, y0, cols, hs) { var y = y0; cols.forEach(function (c, i) { rect(g, 0, y, g.length, hs[i], c); y += hs[i]; }); }
function kip(g, v, ox, oy, s) { var c = build(v); s = s || 1; for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var k = c[y][x]; if (k) rect(g, ox + x * s, oy + y * s, s, s, k); } }
function line(g, x0, y0, x1, y1, t, c) { var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy; for (var n = 0; n < 200; n++) { rect(g, x0, y0, t, t, c); if (x0 === x1 && y0 === y1) break; var e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } } }
function path(g, pts, t, c) { for (var i = 1; i < pts.length; i++) line(g, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], t, c); }

var SUNP = { L: "#FDE68A", y: "#FBBF24", Y: "#F59E0B" };
var SUN6 = [".LLLL.", "LyyyyY", "yyyyyY", "yyyyyY", "yyyyYY", ".YYYY."];
var SUN8 = ["..LLLL..", ".LyyyyY.", "LyyyyyyY", "LyyyyyyY", "yyyyyyYY", "yyyyyyYY", ".yyyyYY.", "..YYYY.."];
var CLOUDP = { w: "#F8FAFC", g: "#CBD5E1" };
var CLOUD = ["...www....", ".wwwwwww..", "wwwwwwwwww", ".gggggggg."];
var PUFF = [".www.", "wwwww"];
var MOON = [".LLL..", "LLL...", "LL....", "LL....", "LLL...", ".LLL.."];
var MOON4 = [".LL.", "LL..", "LL..", "LL..", ".LL."];
var HEART = ["hh.hh", "hhhhh", ".hhh.", "..h.."];
var CROWN = ["y...yy...y", "yy.yyyy.yy", "yryyyyyyry", "YYYYYYYYYY"];
var CROWNP = { y: "#FACC15", Y: "#CA8A04", r: "#EF4444" };
function sparkle(g, x, y, c) { px(g, x, y, c); px(g, x - 1, y, c); px(g, x + 1, y, c); px(g, x, y - 1, c); px(g, x, y + 1, c); }

var C = {
  // A: the tile IS KIP's block: body colour, shade side, two big eyes
  face: function (B, mood) {
    var p = ramp(B), g = grid(24, p.b);
    rect(g, 19, 0, 5, 24, p.s);
    if (mood === "happy") {
      art(g, 5, 9, [".ee.", "e..e"], { e: p.e }); art(g, 14, 9, [".ee.", "e..e"], { e: p.e });
      rect(g, 3, 13, 3, 1, p.h); rect(g, 16, 13, 3, 1, p.h);
    } else if (mood === "sleepy") {
      art(g, 5, 10, ["e..e", ".ee."], { e: p.e }); art(g, 14, 10, ["e..e", ".ee."], { e: p.e });
      art(g, 17, 2, MOON4, { L: "#F8FAFC" }); px(g, 13, 3, "#F8FAFC"); px(g, 9, 5, "#F8FAFC");
    } else if (mood === "determined") {
      rect(g, 0, 3, 24, 2, "#F1F5F9"); rect(g, 19, 3, 5, 2, "#CBD5E1");
      art(g, 5, 7, ["dd..", "..dd"], { d: p.d }); art(g, 14, 7, ["..dd", "dd.."], { d: p.d });
      rect(g, 6, 10, 3, 2, p.e); rect(g, 14, 10, 3, 2, p.e);
    } else if (mood === "crowned") {
      art(g, 7, 2, CROWN, CROWNP);
      rect(g, 6, 9, 3, 3, p.e); rect(g, 14, 9, 3, 3, p.e);
    } else {
      rect(g, 6, 9, 3, 3, p.e); rect(g, 14, 9, 3, 3, p.e);
    }
    return g;
  },
  // B: full KIP standing on a ground strip under a clear sky
  stand: function (B) {
    var g = grid(24);
    bands(g, 0, ["#2563B8", "#2F72C6", "#3D82D2", "#5596DC"], [5, 5, 4, 4]);
    bands(g, 18, ["#6BBF59", "#58A84A", "#47913D"], [2, 2, 2]);
    art(g, 2, 4, PUFF, CLOUDP); art(g, 16, 2, SUN6, SUNP);
    px(g, 3, 20, "#F472B6"); px(g, 6, 22, "#FDE047"); px(g, 20, 20, "#F8FAFC"); px(g, 18, 22, "#F472B6");
    kip(g, { body: B, mood: "proud" }, 4, 3);
    return g;
  },
  // C: sleepy KIP under a moon
  sleepy: function (B) {
    var g = grid(24);
    bands(g, 0, ["#06080E", "#090C16", "#0D111F", "#121729"], [5, 5, 5, 4]);
    bands(g, 19, ["#1E3A2A", "#17301F", "#132819"], [2, 2, 1]);
    [[3, 3], [8, 1], [12, 5], [21, 11], [2, 10], [13, 1], [7, 7]].forEach(function (s, i) { px(g, s[0], s[1], i % 2 ? "#C4B5FD" : "#F8FAFC"); });
    art(g, 16, 2, MOON, { L: "#EDE9FE" });
    kip(g, { body: B, mood: "sleepy" }, 4, 4);
    return g;
  },
  // D: KIP under the recovery weather sky (sun behind a cloud)
  weather: function (B) {
    var g = grid(24);
    bands(g, 0, ["#2A5694", "#3264A3", "#3D72B0", "#4E83BD"], [5, 5, 4, 4]);
    bands(g, 18, ["#5CA857", "#4B9248", "#3D7C3C"], [2, 2, 2]);
    art(g, 12, 2, SUN8, SUNP); art(g, 9, 8, CLOUD, CLOUDP); art(g, 1, 4, PUFF, CLOUDP);
    kip(g, { body: B, mood: "curious" }, -1, 3);
    return g;
  },
  // E: KIP peeking up from the bottom edge
  peek: function (B) {
    var g = grid(24, CREAM);
    sparkle(g, 19, 5, "#FBBF24"); sparkle(g, 5, 7, "#FBBF24");
    kip(g, { body: B, mood: "up" }, -4, 0, 2);
    return g;
  },
  // F: a heartbeat line that becomes KIP
  pulse: function (B) {
    var p = ramp(B), g = grid(24, DARK);
    path(g, [[0, 14], [3, 14], [5, 5], [7, 19], [9, 14], [22, 14]], 2, p.b);
    kip(g, { body: B }, 8, -1);
    return g;
  },
  // G: KIP's block as a charge meter
  battery: function (B) {
    var p = ramp(B), g = grid(24, DARK);
    rect(g, 0, 20, 24, 4, CARD);
    rect(g, 9, 4, 6, 2, SLATE);
    rect(g, 4, 6, 13, 4, SLATE); rect(g, 17, 6, 3, 4, "#22262F");
    rect(g, 4, 10, 13, 10, p.b); rect(g, 17, 10, 3, 10, p.s); rect(g, 4, 10, 13, 1, p.h);
    rect(g, 8, 13, 2, 2, p.e); rect(g, 13, 13, 2, 2, p.e);
    rect(g, 3, 20, 18, 1, "rgba(0,0,0,0.35)");
    return g;
  },
  // H: KIP at its desk by the window
  window: function (B) {
    var g = grid(24, CARD);
    rect(g, 1, 2, 11, 10, SLATE); rect(g, 2, 3, 9, 8, "#3D82D2"); rect(g, 2, 7, 9, 2, "#5596DC"); rect(g, 2, 9, 9, 2, "#3E8A4E");
    rect(g, 7, 4, 2, 2, "#FBBF24"); rect(g, 6, 3, 1, 8, SLATE);
    kip(g, { body: B, mood: "glance" }, 9, 3);
    rect(g, 0, 16, 24, 8, "#4B3A2A"); rect(g, 0, 16, 24, 1, "#6B4F3A");
    rect(g, 3, 13, 3, 3, "#F1F5F9"); px(g, 6, 14, "#F1F5F9"); px(g, 4, 11, "#64748B"); px(g, 5, 10, "#64748B");
    return g;
  },
  // I: two KIPs, one waving at the other
  buddies: function (B) {
    var g = grid(24, CREAM), bud = B.toUpperCase() === "#3B82F6" ? "#FB7185" : "#3B82F6";
    rect(g, 0, 18, 24, 6, "#E7E3DB");
    art(g, 9, 3, HEART, { h: "#F472B6" });
    kip(g, { body: bud }, 9, 3);
    kip(g, { body: B, pose: "wave" }, -2, 3);
    return g;
  },
  // J: one block, two eyes, on the app's dark ground
  block: function (B) {
    var p = ramp(B), g = grid(24, DARK);
    rect(g, 0, 18, 24, 6, CARD);
    rect(g, 6, 6, 9, 12, p.b); rect(g, 15, 6, 3, 12, p.s);
    rect(g, 9, 9, 2, 2, p.e); rect(g, 13, 9, 2, 2, p.e);
    rect(g, 5, 18, 14, 1, "rgba(0,0,0,0.35)");
    return g;
  },
  // engine sprite on transparent (splash)
  sprite: function (B, mood) { var g = grid(16); kip(g, { body: B, mood: mood === "idle" ? "idle" : mood }, 0, 0); return g; },
  // Android adaptive, 108dp canvas at 3dp per cell
  a_bg: function (B) { var p = ramp(B), g = grid(36, p.b); rect(g, 25, 0, 11, 36, p.s); return g; },
  a_fg: function (B) { var p = ramp(B), g = grid(36); rect(g, 12, 15, 3, 3, p.e); rect(g, 20, 15, 3, 3, p.e); return g; },
  a_full: function (B) { var p = ramp(B), g = C.a_bg(B); rect(g, 12, 15, 3, 3, p.e); rect(g, 20, 15, 3, 3, p.e); return g; },
  a_mono: function () { var g = grid(36); rect(g, 11, 11, 14, 14, "#FFFFFF"); hole(g, 14, 14, 3, 3); hole(g, 19, 14, 3, 3); return g; }
};

function tintify(g, tint) {
  return g.map(function (r) { return r.map(function (c) {
    var x = rgb(c || "#000000"), l = (0.299 * x[0] + 0.587 * x[1] + 0.114 * x[2]) / 255;
    return mix("#000000", tint, Math.min(1, 0.12 + l * 1.15));
  }); });
}
function rects(g) {
  var G = g.length, by = {}, order = [];
  for (var y = 0; y < G; y++) {
    var x = 0;
    while (x < G) {
      var c = g[y][x];
      if (!c) { x++; continue; }
      var n = 1;
      while (x + n < G && g[y][x + n] === c) n++;
      if (!by[c]) { by[c] = ""; order.push(c); }
      by[c] += "M" + x + " " + y + "h" + n + "v1h-" + n + "z";
      x += n;
    }
  }
  return order.map(function (f) { return { fill: f, d: by[f] }; });
}
var RADII = { ios: "22.37%", none: "0", circle: "50%", squircle: "32%", round: "18%" };

class Component extends DCLogic {
  renderVals() {
    var pr = this.props;
    var size = Number(pr.size || 192), c = pr.concept || "face", B = pr.body || "#FB7185";
    var g = (C[c] || C.face)(B, pr.mood || "idle");
    if (pr.mode === "tinted") g = tintify(g, pr.tint || "#8EA7FF");
    return { size: size, radius: RADII[pr.mask || "ios"] || "22.37%", vb: "0 0 " + g.length + " " + g.length, layers: rects(g), label: "KIP app icon, " + c };
  }
}
</script>
</body>
