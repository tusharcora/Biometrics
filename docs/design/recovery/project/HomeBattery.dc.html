<style>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px">

    </div>
    <div style="display: flex; align-items: baseline; gap: 12px">

      <div style="display: flex; flex-direction: column">

      <span style="padding: 4px 8px; border-radius: 6px; background: rgba(251,113,133,.12); color: rgb(251,113,133)">Sleep debt −5</span>

    <div style="flex: 1">
      <div class="eyebrow">Tomorrow</div>
      <div style="font-size: 15px"><span class="num" style="font-weight: 700">70–78</span> <span style="color: rgb(155,157,166)">with 8h tonight</span></div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgb(155,157,166)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
