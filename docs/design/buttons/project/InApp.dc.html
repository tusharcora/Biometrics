<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons in the app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;transition:transform 80ms ease,filter 120ms ease}
.b:active{transform:translateY(1px);filter:brightness(.9)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif">
  <div style="position: absolute; top: 54px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between">
    <button class="b" aria-label="Back" style="width: 36px; height: 36px; border-radius: 8px; background: transparent; color: rgb(245,245,244); border: 1px solid transparent">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="font-size: 16px; font-weight: 600">Weekly recap</div>
    <button class="b" aria-label="More" style="width: 36px; height: 36px; border-radius: 8px; background: transparent; color: rgb(245,245,244); border: 1px solid transparent">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </div>

  <div style="position: absolute; top: 108px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="padding: 18px; border-radius: 22px; background: rgb(20,22,27); border: 1px solid rgb(34,37,44); display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; color: rgb(155,157,166)">Week of Sep 28</div>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -.3px">[Recap headline line]</div>
      <button class="b" style="width: 100%; height: 40px; border-radius: 8px; background: rgb(245,245,244); color: rgb(10,11,14); border: 1px solid transparent; font-size: 14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="m16 6-4-4-4 4M12 2v13"></path></svg>Make a shareable recap
      </button>
      <button class="b" style="width: 100%; height: 40px; border-radius: 8px; background: rgba(44,47,55,.3); color: rgb(245,245,244); border: 1px solid rgb(44,47,55); font-size: 14px">Share with buddies</button>
    </div>

    <div style="padding: 14px 16px; border-radius: 18px; background: rgb(20,22,27); border: 1px solid rgb(34,37,44); display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #A78BFA"></div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">Sam</div>
        <div style="font-size: 13px; color: rgb(155,157,166)">wants to be buddies</div>
      </div>
      <button class="b" style="height: 32px; padding: 0 10px; border-radius: 8px; background: rgba(44,47,55,.3); color: rgb(245,245,244); border: 1px solid rgb(44,47,55); font-size: 13px">Decline</button>
      <button class="b" style="height: 32px; padding: 0 10px; border-radius: 8px; background: rgb(245,245,244); color: rgb(10,11,14); border: 1px solid transparent; font-size: 13px">Accept</button>
    </div>

    <div style="padding: 14px 16px; border-radius: 18px; background: rgb(20,22,27); border: 1px solid rgb(34,37,44); display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 14px; color: rgb(155,157,166)">Couldn't load your buddies.</div>
      <button class="b" style="height: 32px; padding: 0 10px; border-radius: 8px; background: rgb(28,31,38); color: rgb(245,245,244); border: 1px solid transparent; font-size: 13px">Retry</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <button class="b" style="height: 36px; padding: 0 10px 0 8px; border-radius: 8px; background: rgba(248,113,113,.2); color: rgb(248,113,113); border: 1px solid transparent; font-size: 14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>Remove buddy
      </button>
      <a href="#" style="font-size: 14px; font-weight: 500; color: rgb(245,245,244); text-decoration: underline; text-underline-offset: 4px">How sharing works</a>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.45)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 40px; border-radius: 38px 38px 0 0; background: rgb(20,22,27); border-top: 1px solid rgb(44,47,55); display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25)"></div>
    <div style="font-size: 20px; font-weight: 700">Share with buddies?</div>
    <div style="font-size: 14px; line-height: 20px; color: rgb(155,157,166)">Your buddies will see: [Recap headline line]. It shows in today's story with this recap's dates, none of its other numbers.</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px">
      <button class="b" style="height: 40px; border-radius: 8px; background: rgba(44,47,55,.3); color: rgb(245,245,244); border: 1px solid rgb(44,47,55); font-size: 14px">Cancel</button>
      <button class="b" style="height: 40px; border-radius: 8px; background: rgb(245,245,244); color: rgb(10,11,14); border: 1px solid transparent; font-size: 14px">Share</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
