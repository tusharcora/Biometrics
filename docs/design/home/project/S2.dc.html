<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile S2 · Category hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244);text-decoration:none}
.ol{border-color:rgb(44,47,55);background:rgba(44,47,55,.3)}
.label{font-family:'Silkscreen',monospace;font-size:11px;line-height:14px;letter-spacing:1px;text-transform:uppercase;color:rgb(155,157,166)}
.card{padding:14px;border-radius:22px;background:rgb(20,22,27);border:1px solid rgb(30,33,40);display:flex;flex-direction:column;gap:8px;box-sizing:border-box;text-decoration:none;color:inherit;min-width:0}
.st{font-size:12px;line-height:16px;color:rgb(155,157,166)}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif; padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 18px">

  <div style="display: flex; align-items: center; gap: 14px">
    <div style="position: relative; width: 76px; height: 76px; flex: none; border-radius: 14px; overflow: hidden; border: 1px solid rgb(30,33,40)">
      <svg aria-hidden="true" width="{{tile.w}}" height="{{tile.h}}" shape-rendering="crispEdges" style="position: absolute; left: 0; top: 0"><sc-for list="{{tile.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
      <svg role="img" aria-label="{{kipLabel}}" width="{{hero.px}}" height="{{hero.px}}" shape-rendering="crispEdges" style="position: absolute; {{hero.pos}}"><sc-for list="{{hero.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-family: Silkscreen, monospace; font-size: 22px; letter-spacing: 1px">PROFILE</span>
      <span style="font-size: 16px; font-weight: 600">Tushar <span style="font-weight: 400; color: rgb(155,157,166)">@tushar</span></span>
      <span class="st">tushar@example.com</span>
    </div>
    <a href="#" class="b ol" aria-label="Watch your weekly recap" style="width: 44px; height: 44px; color: rgb(199,210,254)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></a>
  </div>

  <div class="card" style="gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="label">KIP colour</span><span style="font-size: 13px; font-weight: 600">{{pickName}}</span></div>
    <div role="radiogroup" aria-label="KIP colour" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{swatches}}" as="c" hint-placeholder-count="10"><button role="radio" aria-checked="{{c.checked}}" aria-label="{{c.name}}" onClick="{{c.pick}}" style="height: 32px; padding: 0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: {{c.bg}}; border: {{c.border}}"><span style="width: 16px; height: 16px; border-radius: 3px; background: {{c.hex}}; border: 1px solid rgba(0,0,0,.25); box-sizing: border-box"></span></button></sc-for>
    </div>
    <span class="st">Buddies see KIP in this colour on Home and at the Campfire.</span>
  </div>

  <a href="#" class="card" style="flex-direction: row; align-items: center; gap: 10px">
    <span class="label" style="flex: none">Badges</span>
    <span style="flex: 1; display: flex; gap: 4px"><sc-for list="{{badges}}" as="g" hint-placeholder-count="7"><svg aria-hidden="true" width="20" height="18" shape-rendering="crispEdges"><sc-for list="{{g}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg></sc-for></span>
    <span class="st">4 of 7 ›</span>
  </a>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="8"><a href="#" class="card" style="min-height: 118px"><svg aria-hidden="true" width="30" height="30" shape-rendering="crispEdges"><sc-for list="{{c.icon}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg><span style="font-size: 15px; font-weight: 600">{{c.title}}</span><span class="st">{{c.sub}}</span></a></sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span class="label" style="padding: 0 4px">Account</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button class="b ol" style="height: 44px; font-size: 14px">Sign out</button>
      <button class="b" style="height: 44px; font-size: 14px; color: #F87171; border-color: rgba(248,113,113,.4)">Delete account…</button>
    </div>
    <span class="st" style="padding: 0 4px">Deleting removes your account and all the data stored for it.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
var KN = 16, KE = "................";
var KBASE = [KE, KE, KE, KE, KE, KE, "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", ".....b....s.....", ".....b....s.....", "...zzzzzzzzzz..."];
var KEYES = [[6, 8], [9, 8]];
var WAVE = [[12, 9, "s"], [13, 8, "s"]];
function kRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function kHx(n) { var s = Math.max(0, Math.min(255, Math.round(n))).toString(16); return s.length < 2 ? "0" + s : s; }
function kMix(a, b, k) { var x = kRgb(a), y = kRgb(b); return "#" + kHx(x[0] * (1 - k) + y[0] * k) + kHx(x[1] * (1 - k) + y[1] * k) + kHx(x[2] * (1 - k) + y[2] * k); }
function kDark(a, k) { var x = kRgb(a); return "#" + kHx(x[0] * k) + kHx(x[1] * k) + kHx(x[2] * k); }
function kLum(h) { var c = kRgb(h).map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function kRamp(body) { return { b: body, h: kMix(body, "#FFFFFF", 0.25), s: kDark(body, 0.78), d: kDark(body, 0.6), e: kLum(body) > 0.2 ? "#14161B" : "#F5F5F4", w: "#F8FAFC", z: "rgba(0,0,0,0.35)" }; }
function kCells(body) {
  var p = kRamp(body), g = [], x, y;
  for (y = 0; y < KN; y++) { var row = []; for (x = 0; x < KN; x++) row.push(KBASE[y][x] !== "." ? KBASE[y][x] : null); g.push(row); }
  KEYES.forEach(function (e) { g[e[1]][e[0]] = "e"; });
  WAVE.forEach(function (a) { if (!g[a[1]][a[0]]) g[a[1]][a[0]] = a[2]; });
  return g.map(function (row) { return row.map(function (c) { return c ? p[c] : null; }); });
}
function kLayers(cells, s) { var by = {}, order = [], y, x, c, n; for (y = 0; y < KN; y++) { x = 0; while (x < KN) { c = cells[y][x]; if (!c) { x++; continue; } n = 1; while (x + n < KN && cells[y][x + n] === c) n++; if (!by[c]) { by[c] = ""; order.push(c); } by[c] += "M" + x * s + " " + y * s + "h" + n * s + "v" + s + "h-" + n * s + "z"; x += n; } } return order.map(function (f) { return { fill: f, d: by[f] }; }); }
function pxLayers(rects, u) { var by = {}, order = []; rects.forEach(function (r) { var f = r[4]; if (!by[f]) { by[f] = ""; order.push(f); } by[f] += "M" + r[0] * u + " " + r[1] * u + "h" + r[2] * u + "v" + r[3] * u + "h-" + r[2] * u + "z"; }); return order.map(function (f) { return { fill: f, d: by[f] }; }); }
function tileScene() {
  var r = [], pal = ["#2A5694", "#3264A3", "#3D72B0", "#4E83BD"], i, x;
  for (i = 0; i < 4; i++) { r.push([0, i * 7, 38, 7, pal[i]]); if (i > 0) for (x = i % 2; x < 38; x += 2) r.push([x, i * 7, 1, 1, pal[i - 1]]); }
  r.push([28, 3, 5, 5, "#FBBF24"], [30, 6, 6, 3, "#E5E7EB"]);
  r.push([0, 28, 38, 1, "#5CA857"], [0, 29, 38, 2, "#4B9248"], [0, 31, 38, 7, "#3D7C3C"]);
  return { w: 76, h: 76, layers: pxLayers(r, 2) };
}
// 10 x 10 pixel icons
var IC = {
  heart: [[1, 1, 3, 1, "#F87171"], [6, 1, 3, 1, "#F87171"], [0, 2, 10, 3, "#F87171"], [1, 5, 8, 1, "#F87171"], [2, 6, 6, 1, "#EF4444"], [3, 7, 4, 1, "#EF4444"], [4, 8, 2, 1, "#DC2626"], [1, 2, 2, 1, "#FCA5A5"]],
  globe: [[3, 0, 4, 1, "#60A5FA"], [1, 1, 8, 1, "#60A5FA"], [0, 2, 10, 6, "#60A5FA"], [1, 8, 8, 1, "#3B82F6"], [3, 9, 4, 1, "#3B82F6"], [2, 3, 3, 2, "#4ADE80"], [6, 5, 2, 2, "#4ADE80"]],
  bell: [[4, 0, 2, 1, "#FBBF24"], [3, 1, 4, 1, "#FBBF24"], [2, 2, 6, 5, "#FBBF24"], [1, 7, 8, 1, "#F59E0B"], [4, 8, 2, 2, "#F59E0B"], [3, 2, 1, 3, "#FDE68A"]],
  people: [[1, 1, 3, 3, "#C4B5FD"], [6, 1, 3, 3, "#FB7185"], [0, 5, 5, 4, "#A78BFA"], [5, 5, 5, 4, "#F43F5E"]],
  chat: [[0, 1, 10, 6, "#A5B4FC"], [1, 0, 8, 1, "#A5B4FC"], [1, 7, 3, 1, "#818CF8"], [1, 8, 1, 1, "#818CF8"], [2, 3, 1, 1, "#1E1B4B"], [5, 3, 1, 1, "#1E1B4B"], [8, 3, 1, 1, "#1E1B4B"]],
  coach: [[2, 1, 6, 1, "#FDE68A"], [1, 2, 8, 5, "#FBBF24"], [2, 7, 6, 1, "#F59E0B"], [3, 4, 1, 1, "#1F2937"], [6, 4, 1, 1, "#1F2937"], [3, 8, 4, 2, "#64748B"]],
  memory: [[1, 1, 8, 8, "#64748B"], [2, 2, 6, 6, "#94A3B8"], [3, 3, 4, 4, "#334155"], [0, 3, 1, 1, "#94A3B8"], [9, 3, 1, 1, "#94A3B8"], [0, 6, 1, 1, "#94A3B8"], [9, 6, 1, 1, "#94A3B8"]],
  lock: [[3, 0, 4, 1, "#9CA3AF"], [2, 1, 1, 3, "#9CA3AF"], [7, 1, 1, 3, "#9CA3AF"], [1, 4, 8, 6, "#D1D5DB"], [4, 6, 2, 2, "#374151"]]
};
function badge(col, on) { var c = on ? col : "#2C2F37"; return pxLayers([[3, 0, 4, 1, c], [1, 1, 8, 1, c], [0, 2, 10, 5, c], [1, 7, 8, 1, c], [3, 8, 4, 1, on ? kDark(col, 0.7) : "#22252C"]], 2); }
var PALETTE = [["Coral", "#FB7185"], ["Cobalt", "#3B82F6"], ["Ink", "#2A2F3A"], ["Lemon", "#FDE047"], ["Lilac", "#C4B5FD"], ["Lime", "#A3E635"], ["Mint", "#6EE7B7"], ["Sky", "#7DD3FC"], ["Slate", "#64748B"], ["Snow", "#F1F5F9"]];

class Component extends DCLogic {
  renderVals() {
    var self = this, pick = (this.state && this.state.pick) || 0, s = 4;
    return {
      tile: tileScene(),
      hero: { px: KN * s, layers: kLayers(kCells(PALETTE[pick][1]), s), pos: "left: " + (38 - KN * s / 2) + "px; top: " + (56 - 15 * s) + "px" },
      kipLabel: "Your KIP in " + PALETTE[pick][0],
      pickName: PALETTE[pick][0],
      swatches: PALETTE.map(function (c, i) { var on = i === pick; return { name: c[0], hex: c[1], checked: on ? "true" : "false", bg: on ? "rgb(245,245,244)" : "rgba(44,47,55,.3)", border: on ? "1px solid rgb(245,245,244)" : "1px solid rgb(44,47,55)", pick: function () { self.setState({ pick: i }); } }; }),
      badges: [["#C4B5FD", 1], ["#4ADE80", 1], ["#FBBF24", 1], ["#60A5FA", 1], ["#FB7185", 0], ["#7DD3FC", 0], ["#A3E635", 0]].map(function (b) { return badge(b[0], b[1]); }),
      cats: [
        { title: "Health data", sub: "Google Health · synced 12 min ago", icon: pxLayers(IC.heart, 3) },
        { title: "Time zone", sub: "Device · Europe/London", icon: pxLayers(IC.globe, 3) },
        { title: "Notifications", sub: "Recaps, stickers, requests, messages · 4 of 6", icon: pxLayers(IC.bell, 3) },
        { title: "Buddies & sharing", sub: "@tushar · sharing 3 of 5 · 0 blocked", icon: pxLayers(IC.people, 3) },
        { title: "Chats", sub: "Read receipts on · status on", icon: pxLayers(IC.chat, 3) },
        { title: "Your coach", sub: "Sage · pixel dots · short", icon: pxLayers(IC.coach, 3) },
        { title: "AI Coach", sub: "Coach Memory · turn off", icon: pxLayers(IC.memory, 3) },
        { title: "Sign-in", sub: "Apple, Google · 2 devices", icon: pxLayers(IC.lock, 3) }
      ]
    };
  }
}
</script>
</body>
</html>
