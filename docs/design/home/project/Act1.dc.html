<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity A-1 · Pixel calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244);text-decoration:none}
.ol{border-color:rgb(44,47,55);background:rgba(44,47,55,.3)}
.df{background:rgb(245,245,244);color:rgb(10,11,14)}
.label{font-family:'Silkscreen',monospace;font-size:11px;line-height:14px;letter-spacing:1px;text-transform:uppercase;color:rgb(155,157,166)}
.card{padding:14px;border-radius:22px;background:rgb(20,22,27);border:1px solid rgb(30,33,40);display:flex;flex-direction:column;gap:6px;box-sizing:border-box;min-width:0;text-decoration:none;color:inherit}
.st{font-size:12px;color:rgb(155,157,166)}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 1480px; box-sizing: border-box; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif; padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="#" aria-label="Today: recovery 68, mostly clear. Open Recovery" style="position: relative; width: 72px; height: 72px; flex: none; border-radius: 14px; overflow: hidden; border: 1px solid rgb(30,33,40)">
      <svg aria-hidden="true" width="72" height="72" shape-rendering="crispEdges" style="position: absolute; left: 0; top: 0"><sc-for list="{{tile}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
      <svg aria-hidden="true" width="{{hero.px}}" height="{{hero.px}}" shape-rendering="crispEdges" style="position: absolute; {{hero.pos}}"><sc-for list="{{hero.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <h1 style="margin: 0; font-family: Silkscreen, monospace; font-weight: 400; font-size: 24px; letter-spacing: 1px">ACTIVITY</h1>
      <span style="font-size: 14px">October so far · <b class="num">93,413</b> steps</span>
      <span class="st">10 active days · 4 at goal · streak 2</span>
    </div>
  </div>

  <div role="tablist" aria-label="Metric" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <button class="b df" role="tab" aria-selected="true" style="height: 40px; font-size: 14px"><span style="width: 8px; height: 8px; background: #22C55E"></span>Steps</button>
    <button class="b ol" role="tab" aria-selected="false" style="height: 40px; font-size: 14px"><span style="width: 8px; height: 8px; background: #A78BFA"></span>Sleep</button>
    <button class="b ol" role="tab" aria-selected="false" style="height: 40px; font-size: 14px"><span style="width: 8px; height: 8px; background: #FBBF24"></span>Recovery</button>
  </div>

  <div class="card" style="gap: 10px; padding: 12px">
    <div style="display: flex; align-items: center; gap: 6px">
      <button class="b ol" aria-label="Previous month" style="width: 36px; height: 36px; font-size: 16px">‹</button>
      <span style="flex: 1; text-align: center; font-family: Silkscreen, monospace; font-size: 13px; letter-spacing: 1px">OCTOBER 2026</span>
      <button class="b ol" aria-label="Next month" disabled style="width: 36px; height: 36px; font-size: 16px; opacity: .4">›</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button class="b df" style="height: 30px; font-size: 12px">Month</button>
      <button class="b" style="height: 30px; font-size: 12px; color: rgb(155,157,166)">Year</button>
      <button class="b" style="height: 30px; font-size: 12px; color: rgb(155,157,166)">YTD</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center" class="label"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><a href="#" aria-label="{{c.aria}}" style="position: relative; height: 46px; border-radius: 3px; background: {{c.bg}}; border: {{c.border}}; box-sizing: border-box; text-decoration: none; display: block"><span class="num" style="position: absolute; left: 4px; top: 3px; font-size: 10px; font-weight: 600; color: {{c.fg}}">{{c.n}}</span><sc-if value="{{c.has}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 2px; bottom: 2px; width: 15px; height: 15px; background: rgba(10,11,14,.72); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" shape-rendering="crispEdges"><sc-for list="{{c.icon}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg></span></sc-if></a></sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
      <span style="display: flex; align-items: center; gap: 3px" class="st">Less<sc-for list="{{legend}}" as="g" hint-placeholder-count="5"><span style="width: 10px; height: 10px; background: {{g}}"></span></sc-for>More</span>
      <span style="display: flex; align-items: center; gap: 4px" class="st">Recovery<sc-for list="{{wx}}" as="w" hint-placeholder-count="4"><svg aria-hidden="true" width="11" height="11" shape-rendering="crispEdges"><sc-for list="{{w}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg></sc-for></span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="6"><div class="card" style="border-radius: 14px; padding: 10px; gap: 2px"><span class="st" style="font-size: 11px">{{s.k}}</span><span class="num" style="font-size: 15px; font-weight: 600">{{s.v}}</span></div></sc-for>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
    <span class="label">Against your usual · 30d</span>
    <span style="display: flex; gap: 4px"><a href="#" class="b" style="height: 32px; padding: 0 8px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px">Patterns</a><a href="#" class="b" style="height: 32px; padding: 0 8px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px">All trends</a></span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"><a href="#" class="card"><div style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; background: {{t.c}}"></span><span class="st">{{t.name}}</span></div><span class="num" style="font-size: 22px; font-weight: 600">{{t.v}}</span><svg aria-hidden="true" width="150" height="28" shape-rendering="crispEdges"><sc-for list="{{t.bars}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg><span class="st">{{t.d}}</span></a></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
var KN = 16, KE = "................";
var KBASE = [KE, KE, KE, KE, KE, KE, "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", ".....b....s.....", ".....b....s.....", "...zzzzzzzzzz..."];
function kDark(a, k) { var n = parseInt(a.slice(1), 16), x = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return "#" + x.map(function (v) { var s = Math.round(v * k).toString(16); return s.length < 2 ? "0" + s : s; }).join(""); }
function kipWave(body, s) {
  var p = { b: body, s: kDark(body, 0.78), e: "#14161B", z: "rgba(0,0,0,0.35)" }, g = [], x, y;
  for (y = 0; y < KN; y++) { var row = []; for (x = 0; x < KN; x++) row.push(KBASE[y][x] !== "." ? KBASE[y][x] : null); g.push(row); }
  g[8][6] = "e"; g[8][9] = "e"; g[9][12] = "s"; g[8][13] = "s";
  var by = {}, order = [];
  for (y = 0; y < KN; y++) { x = 0; while (x < KN) { var c = g[y][x]; if (!c) { x++; continue; } var n = 1; while (x + n < KN && g[y][x + n] === c) n++; var f = p[c]; if (!by[f]) { by[f] = ""; order.push(f); } by[f] += "M" + x * s + " " + y * s + "h" + n * s + "v" + s + "h-" + n * s + "z"; x += n; } }
  return { px: KN * s, layers: order.map(function (f) { return { fill: f, d: by[f] }; }) };
}
function pxLayers(rects, u) { var by = {}, order = []; rects.forEach(function (r) { var f = r[4]; if (!by[f]) { by[f] = ""; order.push(f); } by[f] += "M" + r[0] * u + " " + r[1] * u + "h" + r[2] * u + "v" + r[3] * u + "h-" + r[2] * u + "z"; }); return order.map(function (f) { return { fill: f, d: by[f] }; }); }
// Recovery-page weather icons (11 grid), exact WeatherStrip rects
var ICON = {
  clear: [[3, 3, 5, 5, "#FBBF24"], [5, 1, 1, 1, "#FDE68A"], [1, 5, 1, 1, "#FDE68A"], [9, 5, 1, 1, "#FDE68A"], [5, 9, 1, 1, "#FDE68A"]],
  mostly: [[2, 2, 5, 5, "#FBBF24"], [4, 5, 6, 3, "#E5E7EB"]],
  cloudy: [[1, 4, 9, 4, "#9CA3AF"], [3, 3, 5, 1, "#9CA3AF"]],
  stormy: [[1, 3, 9, 4, "#6B7280"], [3, 2, 5, 1, "#6B7280"], [5, 7, 2, 1, "#FBBF24"], [4, 8, 2, 1, "#FBBF24"], [5, 9, 1, 1, "#FBBF24"]]
};
var STEPS = { 1: 9812, 2: 6204, 3: 12450, 4: 14102, 5: 7880, 6: 4215, 7: 8930, 8: 10388, 9: 11020, 10: 8412 };
var REC = { 1: 58, 2: 72, 3: 85, 4: 81, 5: 66, 6: 38, 7: 62, 8: 68, 9: 74, 10: 68 };
function band(v) { return v >= 80 ? "clear" : v >= 60 ? "mostly" : v >= 40 ? "cloudy" : "stormy"; }
var WORD = { clear: "clear skies", mostly: "mostly clear", cloudy: "cloudy", stormy: "stormy" };
var LV = ["rgb(28,31,38)", "#14532D", "#166534", "#22C55E", "#4ADE80"];
function lvl(v) { return v >= 10000 ? 4 : v >= 7500 ? 3 : v >= 5000 ? 2 : 1; }
function bars(base, amp, seed, col) { var r = [], vals = [], i; for (i = 0; i < 30; i++) vals.push(base + amp * Math.sin((i + seed) * 0.7) + amp * 0.5 * Math.sin((i + seed) * 1.9)); var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals); vals.forEach(function (v, j) { var h = 2 + 2 * Math.round((v - mn) / (mx - mn || 1) * 12); r.push([j * 5, 28 - h, 4, h, j === 29 ? col : col + "88"]); }); return pxLayers(r, 1); }
function tileArt() {
  var r = [], pal = ["#2A5694", "#3264A3", "#3D72B0", "#4E83BD"], i, x;
  for (i = 0; i < 4; i++) { r.push([0, i * 7, 36, 7, pal[i]]); if (i > 0) for (x = i % 2; x < 36; x += 2) r.push([x, i * 7, 1, 1, pal[i - 1]]); }
  r.push([25, 3, 5, 5, "#FBBF24"], [27, 6, 6, 3, "#E5E7EB"], [0, 29, 36, 1, "#5CA857"], [0, 30, 36, 2, "#4B9248"], [0, 32, 36, 4, "#3D7C3C"]);
  return pxLayers(r, 2);
}
class Component extends DCLogic {
  renderVals() {
    var cells = [], i, hero = kipWave("#FB7185", 3);
    hero.pos = "left: " + (30 - hero.px / 2) + "px; top: " + (58 - 45) + "px";
    for (i = 0; i < 3; i++) cells.push({ n: "", bg: "transparent", border: "0", fg: "transparent", has: false, icon: [], aria: "" });
    for (i = 1; i <= 31; i++) {
      var v = STEPS[i];
      if (v) { var b = band(REC[i]); cells.push({ n: i, bg: LV[lvl(v)], border: i === 10 ? "2px solid rgb(245,245,244)" : "0", fg: lvl(v) >= 3 ? "rgb(10,11,14)" : "rgb(245,245,244)", has: true, icon: pxLayers(ICON[b], 1), aria: "Oct " + i + ": " + v.toLocaleString("en-US") + " steps, recovery " + REC[i] + " " + WORD[b] }); }
      else cells.push({ n: i, bg: "transparent", border: "1px solid rgb(36,39,47)", fg: "rgb(90,94,104)", has: false, icon: [], aria: "Oct " + i });
    }
    cells.push({ n: "", bg: "transparent", border: "0", fg: "transparent", has: false, icon: [], aria: "" });
    return {
      tile: tileArt(),
      hero: hero,
      cells: cells,
      legend: LV,
      wx: ["clear", "mostly", "cloudy", "stormy"].map(function (k) { return pxLayers(ICON[k], 1); }),
      stats: [{ k: "Total", v: "93,413" }, { k: "Daily avg", v: "9,341" }, { k: "Active days", v: "10" }, { k: "Goal streak", v: "2 days" }, { k: "Best day", v: "14,102" }, { k: "Best date", v: "Sat, Oct 4" }],
      tiles: [
        { name: "Resting HR", v: "54 bpm", c: "#F87171", d: "2 below your usual", bars: bars(56, 2, 1, "#F87171") },
        { name: "Sleep", v: "7h 12m", c: "#A78BFA", d: "+14 min vs your usual", bars: bars(7, .6, 3, "#A78BFA") },
        { name: "HRV", v: "48 ms", c: "#60A5FA", d: "Steady", bars: bars(47, 4, 5, "#60A5FA") },
        { name: "Recovery", v: "68", c: "#4ADE80", d: "+4 vs your usual", bars: bars(64, 10, 2, "#4ADE80") }
      ]
    };
  }
}
</script>
</body>
</html>
