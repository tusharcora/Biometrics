<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile · KIP colour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244);text-decoration:none}
.ol{border-color:rgb(44,47,55);background:rgba(44,47,55,.3)}
.df{background:rgb(245,245,244);color:rgb(10,11,14)}
.sw{width:100%;height:56px;padding:0}
.label{font-family:'Silkscreen',monospace;font-size:11px;line-height:14px;letter-spacing:1px;text-transform:uppercase;color:rgb(155,157,166)}
.row{display:flex;align-items:center;min-height:52px;padding:0 16px;border-top:1px solid rgb(30,33,40);font-size:15px;text-decoration:none;color:rgb(245,245,244)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif; padding: 54px 16px 32px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="#" class="b ol" aria-label="Back" style="width: 40px; height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; text-align: center; font-family: Silkscreen, monospace; font-weight: 400; font-size: 20px; letter-spacing: 1px">PROFILE</h1>
    <div style="width: 40px"></div>
  </div>

  <div style="position: relative; width: 358px; height: 192px; border-radius: 22px; overflow: hidden; border: 1px solid rgb(30,33,40); box-sizing: border-box; flex: none">
    <svg aria-hidden="true" width="{{sc.w}}" height="{{sc.h}}" shape-rendering="crispEdges" style="position: absolute; left: 0; top: 0"><sc-for list="{{sc.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    <svg role="img" aria-label="{{previewLabel}}" width="{{hero.px}}" height="{{hero.px}}" shape-rendering="crispEdges" style="position: absolute; {{hero.pos}}"><sc-for list="{{hero.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    <div style="position: absolute; left: 14px; top: 12px; display: flex; flex-direction: column; gap: 2px">
      <span class="label" style="color: rgb(199,210,254)">Your KIP</span>
      <span style="font-size: 17px; font-weight: 600">{{pickName}}</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between"><span class="label">Colour</span><span style="font-size: 12px; color: rgb(155,157,166)">Buddies see this colour</span></div>
    <div role="radiogroup" aria-label="KIP colour" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{swatches}}" as="c" hint-placeholder-count="10"><div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><button class="{{c.cls}}" role="radio" aria-checked="{{c.checked}}" aria-label="{{c.name}}" onClick="{{c.pick}}"><span style="width: 28px; height: 28px; border-radius: 6px; background: {{c.hex}}; border: 1px solid rgba(0,0,0,.25); box-sizing: border-box"></span></button><span style="font-size: 12px; color: {{c.lc}}">{{c.name}}</span></div></sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button class="b ol" style="height: 44px; font-size: 14px" onClick="{{reset}}">Reset to coral</button>
    <button class="b df" style="height: 44px; font-size: 14px">Save colour</button>
  </div>

  <div style="border-radius: 22px; background: rgb(20,22,27); border: 1px solid rgb(30,33,40); overflow: hidden; display: flex; flex-direction: column">
    <a href="#" class="row" style="border-top: 0"><span style="flex: 1">Account</span><span style="color: rgb(155,157,166)">›</span></a>
    <a href="#" class="row"><span style="flex: 1">Notifications</span><span style="color: rgb(155,157,166)">›</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var KN = 16, KE = "................";
var KBASE = [KE, KE, KE, KE, KE, KE, "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", ".....b....s.....", ".....b....s.....", "...zzzzzzzzzz..."];
var KEYES = [[6, 8], [9, 8]];
var WAVE = [[12, 9, "s"], [13, 8, "s"]];
function kRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function kHx(n) { var s = Math.max(0, Math.min(255, Math.round(n))).toString(16); return s.length < 2 ? "0" + s : s; }
function kMix(a, b, k) { var x = kRgb(a), y = kRgb(b); return "#" + kHx(x[0] * (1 - k) + y[0] * k) + kHx(x[1] * (1 - k) + y[1] * k) + kHx(x[2] * (1 - k) + y[2] * k); }
function kDark(a, k) { var x = kRgb(a); return "#" + kHx(x[0] * k) + kHx(x[1] * k) + kHx(x[2] * k); }
function kLum(h) { var c = kRgb(h).map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function kRamp(body) { return { b: body, h: kMix(body, "#FFFFFF", 0.25), s: kDark(body, 0.78), d: kDark(body, 0.6), e: kLum(body) > 0.2 ? "#14161B" : "#F5F5F4", w: "#F8FAFC", z: "rgba(0,0,0,0.35)" }; }
function kWave(body) {
  var p = kRamp(body), g = [], x, y;
  for (y = 0; y < KN; y++) { var row = []; for (x = 0; x < KN; x++) row.push(KBASE[y][x] !== "." ? KBASE[y][x] : null); g.push(row); }
  KEYES.forEach(function (e) { g[e[1]][e[0]] = "e"; });
  WAVE.forEach(function (a) { if (!g[a[1]][a[0]]) g[a[1]][a[0]] = a[2]; });
  return g.map(function (row) { return row.map(function (c) { return c ? p[c] : null; }); });
}
function kLayers(cells, s) { var by = {}, order = [], y, x, c, n; for (y = 0; y < KN; y++) { x = 0; while (x < KN) { c = cells[y][x]; if (!c) { x++; continue; } n = 1; while (x + n < KN && cells[y][x + n] === c) n++; if (!by[c]) { by[c] = ""; order.push(c); } by[c] += "M" + x * s + " " + y * s + "h" + n * s + "v" + s + "h-" + n * s + "z"; x += n; } } return order.map(function (f) { return { fill: f, d: by[f] }; }); }
function pxLayers(rects, u) { var by = {}, order = []; rects.forEach(function (r) { var f = r[4]; if (!by[f]) { by[f] = ""; order.push(f); } by[f] += "M" + r[0] * u + " " + r[1] * u + "h" + r[2] * u + "v" + r[3] * u + "h-" + r[2] * u + "z"; }); return order.map(function (f) { return { fill: f, d: by[f] }; }); }
function scene() {
  var W = 119, H = 64, gy = 52, r = [], pal = ["#15233D", "#1A2B49", "#203456", "#273E63"], bh = Math.floor(gy / 4), i, x;
  for (i = 0; i < 4; i++) { var y0 = i * bh, hh = i === 3 ? gy - y0 : bh; r.push([0, y0, W, hh, pal[i]]); if (i > 0) for (x = i % 2; x < W; x += 2) r.push([x, y0, 1, 1, pal[i - 1]]); }
  [[103, 6, 6, 1, "#FDE68A"], [101, 7, 10, 1, "#FCD34D"], [100, 8, 12, 7, "#FBBF24"], [101, 15, 10, 1, "#F59E0B"], [103, 16, 6, 1, "#F59E0B"]].forEach(function (q) { r.push(q); });
  var G = ["#4A8A5C", "#3A7049", "#2D5A3A"];
  r.push([0, gy, W, 1, G[0]], [0, gy + 1, W, 2, G[1]], [0, gy + 3, W, H - gy - 3, G[2]]);
  for (x = 4; x < W; x += 13) r.push([x, gy - 1, 1, 1, G[0]], [x + 2, gy - 1, 1, 1, G[0]]);
  return { w: W * 3, h: H * 3, layers: pxLayers(r, 3) };
}
var PALETTE = [["Coral", "#FB7185"], ["Cobalt", "#3B82F6"], ["Ink", "#2A2F3A"], ["Lemon", "#FDE047"], ["Lilac", "#C4B5FD"], ["Lime", "#A3E635"], ["Mint", "#6EE7B7"], ["Sky", "#7DD3FC"], ["Slate", "#64748B"], ["Snow", "#F1F5F9"]];

class Component extends DCLogic {
  renderVals() {
    var self = this, pick = (this.state && this.state.pick) || 0;
    var hex = PALETTE[pick][1], s = 6;
    var hero = { px: KN * s, layers: kLayers(kWave(hex), s), pos: "left: " + (179 - KN * s / 2) + "px; top: " + (156 - 15 * s) + "px" };
    return {
      sc: scene(),
      hero: hero,
      pickName: PALETTE[pick][0] + " · " + hex,
      previewLabel: "Your KIP in " + PALETTE[pick][0],
      reset: function () { self.setState({ pick: 0 }); },
      swatches: PALETTE.map(function (c, i) {
        var on = i === pick;
        return { name: c[0], hex: c[1], cls: on ? "b df sw" : "b ol sw", checked: on ? "true" : "false", lc: on ? "rgb(245,245,244)" : "rgb(155,157,166)", pick: function () { self.setState({ pick: i }); } };
      })
    };
  }
}
</script>
</body>
</html>
