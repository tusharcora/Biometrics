<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity A-2 · Day almanac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244);text-decoration:none}
.ol{border-color:rgb(44,47,55);background:rgba(44,47,55,.3)}
.df{background:rgb(245,245,244);color:rgb(10,11,14)}
.label{font-family:'Silkscreen',monospace;font-size:11px;line-height:14px;letter-spacing:1px;text-transform:uppercase;color:rgb(155,157,166)}
.list{border-radius:22px;background:rgb(20,22,27);border:1px solid rgb(30,33,40);overflow:hidden}
.st{font-size:12px;color:rgb(155,157,166)}
.num{font-variant-numeric:tabular-nums}
.day{display:grid;grid-template-columns:40px 58px 1fr;align-items:center;gap:8px;min-height:58px;padding:8px 14px;border-top:1px solid rgb(30,33,40);text-decoration:none;color:inherit;box-sizing:border-box}
.day:first-child{border-top:0}
.bar{height:8px;background:rgb(28,31,38);position:relative}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif; padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 14px">

  <div style="position: relative; width: 358px; height: 84px; border-radius: 22px; overflow: hidden; border: 1px solid rgb(30,33,40); box-sizing: border-box; flex: none">
    <svg aria-hidden="true" width="358" height="84" shape-rendering="crispEdges" style="position: absolute; left: 0; top: 0"><sc-for list="{{strip}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    <svg role="img" aria-label="Your KIP, waving" width="{{hero.px}}" height="{{hero.px}}" shape-rendering="crispEdges" style="position: absolute; {{hero.pos}}"><sc-for list="{{hero.layers}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    <div style="position: absolute; left: 84px; top: 14px; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: Silkscreen, monospace; font-weight: 400; font-size: 22px; letter-spacing: 1px">ACTIVITY</h1>
      <span style="font-size: 13px">Last 7 days · 64,947 steps · 7 nights</span>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px"><span class="label">This week</span><span class="st">Tap a day · moon opens Sleep</span></div>
  <div class="list">
    <div style="display: grid; grid-template-columns: 40px 58px 1fr; gap: 8px; padding: 10px 14px 4px" class="label"><span>Day</span><span>Recovery</span><span>Sleep · steps</span></div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7"><a href="#" class="day" aria-label="{{d.aria}}" style="background: {{d.bg}}">
      <span style="display: flex; flex-direction: column"><span class="label" style="font-size: 10px; color: {{d.lc}}">{{d.dow}}</span><span class="num" style="font-size: 15px; font-weight: 600">{{d.n}}</span></span>
      <span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="22" height="22" shape-rendering="crispEdges"><sc-for list="{{d.icon}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg><span class="num" style="font-size: 15px; font-weight: 600; color: {{d.rc}}">{{d.rec}}</span></span>
      <span style="display: flex; flex-direction: column; gap: 5px">
        <span style="display: flex; align-items: center; gap: 6px"><span class="bar" style="flex: 1"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{d.sw}}; background: #A78BFA"></span></span><span class="num st" style="width: 52px; text-align: right">{{d.sleep}}</span></span>
        <span style="display: flex; align-items: center; gap: 6px"><span class="bar" style="flex: 1"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{d.stw}}; background: #22C55E"></span></span><span class="num st" style="width: 52px; text-align: right">{{d.steps}}</span></span>
      </span>
    </a></sc-for>
  </div>

  <div class="list" style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span class="label" style="flex: 1">2026 so far</span>
      <button class="b df" style="height: 32px; padding: 0 10px; font-size: 12px">Steps</button>
      <button class="b ol" style="height: 32px; padding: 0 10px; font-size: 12px">Sleep</button>
    </div>
    <svg role="img" aria-label="Steps per day, January to October 2026" width="328" height="56" shape-rendering="crispEdges"><sc-for list="{{year}}" as="l" hint-placeholder-count="0"><path d="{{l.d}}" fill="{{l.fill}}"></path></sc-for></svg>
    <div style="position: relative; height: 12px"><sc-for list="{{months}}" as="m" hint-placeholder-count="10"><span class="label" style="position: absolute; top: 0; font-size: 9px; line-height: 12px; padding: 0; {{m.pos}}">{{m.t}}</span></sc-for></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
      <div><div class="st" style="font-size: 11px">Total</div><div class="num" style="font-size: 15px; font-weight: 600">2.49M</div></div>
      <div><div class="st" style="font-size: 11px">Daily avg</div><div class="num" style="font-size: 15px; font-weight: 600">8,846</div></div>
      <div><div class="st" style="font-size: 11px">Goal days</div><div class="num" style="font-size: 15px; font-weight: 600">112</div></div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
    <span class="label">Against your usual · 30d</span>
    <span style="display: flex; gap: 4px"><a href="#" class="b" style="height: 32px; padding: 0 8px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px">Patterns</a><a href="#" class="b" style="height: 32px; padding: 0 8px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px">All trends</a></span>
  </div>
  <div class="list">
    <sc-for list="{{usual}}" as="u" hint-placeholder-count="4"><a href="#" class="day" style="grid-template-columns: 10px 1fr auto auto; min-height: 50px"><span style="width: 8px; height: 8px; background: {{u.c}}"></span><span style="font-size: 15px">{{u.name}}</span><span class="st">{{u.d}}</span><span class="num" style="font-size: 15px; font-weight: 600; min-width: 64px; text-align: right">{{u.v}}</span></a></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
var KN = 16, KE = "................";
var KBASE = [KE, KE, KE, KE, KE, KE, "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", "....bbbbbbbs....", ".....b....s.....", ".....b....s.....", "...zzzzzzzzzz..."];
function kDark(a, k) { var n = parseInt(a.slice(1), 16), x = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return "#" + x.map(function (v) { var s = Math.round(v * k).toString(16); return s.length < 2 ? "0" + s : s; }).join(""); }
function kipWave(body, s) {
  var p = { b: body, s: kDark(body, 0.78), e: "#14161B", z: "rgba(0,0,0,0.35)" }, g = [], x, y;
  for (y = 0; y < KN; y++) { var row = []; for (x = 0; x < KN; x++) row.push(KBASE[y][x] !== "." ? KBASE[y][x] : null); g.push(row); }
  g[8][6] = "e"; g[8][9] = "e"; g[9][12] = "s"; g[8][13] = "s";
  var by = {}, order = [];
  for (y = 0; y < KN; y++) { x = 0; while (x < KN) { var c = g[y][x]; if (!c) { x++; continue; } var n = 1; while (x + n < KN && g[y][x + n] === c) n++; var f = p[c]; if (!by[f]) { by[f] = ""; order.push(f); } by[f] += "M" + x * s + " " + y * s + "h" + n * s + "v" + s + "h-" + n * s + "z"; x += n; } }
  return { px: KN * s, layers: order.map(function (f) { return { fill: f, d: by[f] }; }) };
}
function pxLayers(rects, u) { var by = {}, order = []; rects.forEach(function (r) { var f = r[4]; if (!by[f]) { by[f] = ""; order.push(f); } by[f] += "M" + r[0] * u + " " + r[1] * u + "h" + r[2] * u + "v" + r[3] * u + "h-" + r[2] * u + "z"; }); return order.map(function (f) { return { fill: f, d: by[f] }; }); }
var ICON = {
  clear: [[3, 3, 5, 5, "#FBBF24"], [5, 1, 1, 1, "#FDE68A"], [1, 5, 1, 1, "#FDE68A"], [9, 5, 1, 1, "#FDE68A"], [5, 9, 1, 1, "#FDE68A"]],
  mostly: [[2, 2, 5, 5, "#FBBF24"], [4, 5, 6, 3, "#E5E7EB"]],
  cloudy: [[1, 4, 9, 4, "#9CA3AF"], [3, 3, 5, 1, "#9CA3AF"]],
  stormy: [[1, 3, 9, 4, "#6B7280"], [3, 2, 5, 1, "#6B7280"], [5, 7, 2, 1, "#FBBF24"], [4, 8, 2, 1, "#FBBF24"], [5, 9, 1, 1, "#FBBF24"]]
};
function band(v) { return v >= 80 ? "clear" : v >= 60 ? "mostly" : v >= 40 ? "cloudy" : "stormy"; }
var WEEK = [
  ["FRI", 10, 68, "7h 12m", 432, 8412, true], ["THU", 9, 74, "7h 30m", 450, 11020], ["WED", 8, 68, "7h 05m", 425, 10388], ["TUE", 7, 62, "6h 48m", 408, 8930],
  ["MON", 6, 38, "5h 10m", 310, 4215], ["SUN", 5, 66, "7h 40m", 460, 7880], ["SAT", 4, 81, "8h 21m", 501, 14102]
];
function strip() {
  var r = [], pal = ["#2A5694", "#3264A3", "#3D72B0", "#4E83BD"], i, x, W = 179;
  for (i = 0; i < 4; i++) { r.push([0, i * 8, W, 8, pal[i]]); if (i > 0) for (x = i % 2; x < W; x += 2) r.push([x, i * 8, 1, 1, pal[i - 1]]); }
  r.push([160, 5, 6, 1, "#FDE68A"], [159, 6, 8, 6, "#FBBF24"], [160, 12, 6, 1, "#F59E0B"], [162, 10, 10, 3, "#E5E7EB"], [163, 9, 6, 1, "#F3F4F6"]);
  r.push([0, 32, W, 1, "#5CA857"], [0, 33, W, 2, "#4B9248"], [0, 35, W, 7, "#3D7C3C"]);
  for (x = 6; x < W; x += 15) r.push([x, 31, 1, 1, "#5CA857"], [x + 2, 31, 1, 1, "#5CA857"]);
  return pxLayers(r, 2);
}
function yearGrid() {
  var LV = ["#1C1F26", "#14532D", "#166534", "#22C55E", "#4ADE80"], r = [], w, d, seed = 7;
  for (w = 0; w < 41; w++) for (d = 0; d < 7; d++) {
    if (w === 40 && d > 4) continue;
    seed = (seed * 9301 + 49297) % 233280; var q = seed / 233280, lv = q < 0.06 ? 0 : q < 0.25 ? 1 : q < 0.55 ? 2 : q < 0.82 ? 3 : 4;
    r.push([w * 8, d * 8, 6, 6, LV[lv]]);
  }
  r.push([40 * 8 - 1, 4 * 8 - 1, 8, 1, "#F5F5F4"], [40 * 8 - 1, 4 * 8 + 6, 8, 1, "#F5F5F4"], [40 * 8 - 1, 4 * 8 - 1, 1, 8, "#F5F5F4"], [40 * 8 + 6, 4 * 8 - 1, 1, 8, "#F5F5F4"]);
  return pxLayers(r, 1);
}
class Component extends DCLogic {
  renderVals() {
    var hero = kipWave("#FB7185", 3);
    hero.pos = "left: " + (40 - hero.px / 2) + "px; top: " + (64 - 45) + "px";
    var starts = [0, 4.4, 8.4, 12.9, 17.1, 21.6, 25.9, 30.3, 34.7, 39];
    return {
      strip: strip(),
      hero: hero,
      days: WEEK.map(function (w) {
        var b = band(w[2]);
        return { dow: w[0], n: w[1], rec: w[2], rc: w[2] < 40 ? "rgb(248,113,113)" : "rgb(245,245,244)", icon: pxLayers(ICON[b], 2), sleep: w[3], sw: Math.round(w[4] / 540 * 100) + "%", steps: w[5].toLocaleString("en-US"), stw: Math.min(100, Math.round(w[5] / 15000 * 100)) + "%", bg: w[6] ? "rgba(255,255,255,.03)" : "transparent", lc: w[6] ? "rgb(245,245,244)" : "rgb(155,157,166)", aria: w[0] + " " + w[1] + " October: recovery " + w[2] + ", slept " + w[3] + ", " + w[5] + " steps" };
      }),
      year: yearGrid(),
      months: ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O"].map(function (t, i) { return { t: t, pos: "left: " + Math.round(starts[i] * 8) + "px" }; }),
      usual: [
        { name: "Resting HR", v: "54 bpm", c: "#F87171", d: "2 below" },
        { name: "Sleep", v: "7h 12m", c: "#A78BFA", d: "+14 min" },
        { name: "HRV", v: "48 ms", c: "#60A5FA", d: "steady" },
        { name: "Recovery", v: "68", c: "#4ADE80", d: "+4" }
      ]
    };
  }
}
</script>
</body>
</html>
