<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chats inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244)}
.b:active{transform:translateY(1px);filter:brightness(.9)}
.px{font-family:'Silkscreen',monospace}
input::placeholder{color:rgb(155,157,166)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif">
  <div style="position: absolute; top: 54px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between">
    <button class="b" aria-label="Back to Social" style="width: 36px; height: 36px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="font-size: 17px; font-weight: 700">@tushar</div>
    <button class="b" aria-label="New message" style="width: 36px; height: 36px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </button>
  </div>

  <label style="position: absolute; top: 104px; left: 16px; right: 16px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: rgb(28,31,38); color: rgb(155,157,166)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input aria-label="Search chats" placeholder="Search" style="flex: 1; border: 0; outline: none; background: transparent; color: rgb(245,245,244); font-family: inherit; font-size: 15px">
  </label>

  <div style="position: absolute; top: 160px; left: 0; right: 0; display: flex; gap: 14px; padding: 0 16px; overflow: hidden">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="5">
      <div style="width: 68px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="max-width: 72px; min-height: 26px; padding: 4px 8px; border-radius: 12px; background: {{n.bubbleBg}}; border: 1px solid {{n.bubbleBd}}; font-size: 10.5px; line-height: 13px; color: {{n.bubbleFg}}; text-align: center; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{n.note}}</div>
        <div style="width: 60px; height: 60px; border-radius: 30px; background: rgb(20,22,27); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px {{n.ring}}">
          <svg width="40" height="40" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="3" y="2" width="6" height="1" fill="{{n.c}}"></rect><rect x="2" y="3" width="8" height="6" fill="{{n.c}}"></rect><rect x="3" y="9" width="6" height="1" fill="{{n.c}}"></rect><rect x="4" y="5" width="1" height="2" fill="#14161B"></rect><rect x="7" y="5" width="1" height="2" fill="#14161B"></rect></svg>
        </div>
        <div style="font-size: 12px; color: rgb(155,157,166)">{{n.name}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; top: 304px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center">
    <div style="font-size: 16px; font-weight: 700">Messages</div>
    <a href="Requests.dc.html" style="font-size: 14px; font-weight: 500; color: rgb(245,245,244); text-decoration: underline; text-underline-offset: 4px">Requests (2)</a>
  </div>

  <div style="position: absolute; top: 340px; left: 0; right: 0; display: flex; flex-direction: column">
    <sc-for list="{{threads}}" as="t" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
        <a href="Thread.dc.html" aria-label="{{t.label}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit">
          <div style="position: relative; width: 52px; height: 52px; flex: none; border-radius: 26px; background: rgb(20,22,27); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px {{t.ring}}">
            <svg width="34" height="34" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="3" y="2" width="6" height="1" fill="{{t.c}}"></rect><rect x="2" y="3" width="8" height="6" fill="{{t.c}}"></rect><rect x="3" y="9" width="6" height="1" fill="{{t.c}}"></rect><rect x="4" y="5" width="1" height="2" fill="#14161B"></rect><rect x="7" y="5" width="1" height="2" fill="#14161B"></rect></svg>
            <sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 7px; background: rgb(74,222,128); border: 2.5px solid rgb(10,11,14)"></span>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 15px; font-weight: {{t.weight}}">{{t.name}}</div>
            <div style="font-size: 13.5px; color: {{t.lineColor}}; font-weight: {{t.lineWeight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.line}}</div>
          </div>
          <sc-if value="{{t.unread}}" hint-placeholder-val="{{ false }}">
            <span style="width: 9px; height: 9px; border-radius: 5px; background: rgb(45,212,191); flex: none"></span>
          </sc-if>
        </a>
        <button class="b" aria-label="{{t.stickerLabel}}" style="width: 32px; height: 32px; color: rgb(155,157,166)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4l-5.2 2.8 1-5.9L3.5 9.2l5.9-.8z"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mine = { bubbleBg: 'transparent', bubbleBd: 'rgba(255,255,255,.18)', bubbleFg: 'rgb(155,157,166)' };
    const theirs = { bubbleBg: 'rgb(28,31,38)', bubbleBd: 'transparent', bubbleFg: 'rgb(245,245,244)' };
    const notes = [
      Object.assign({ name: 'Your note', note: 'Share a note', c: '#34D399', ring: 'rgb(44,47,55)' }, mine),
      Object.assign({ name: 'Bea', note: 'early night, long day', c: '#2DD4BF', ring: 'rgb(45,212,191)' }, theirs),
      Object.assign({ name: 'Sam', note: 'run at 6, who is in?', c: '#A78BFA', ring: 'rgb(45,212,191)' }, theirs),
      Object.assign({ name: 'Ana', note: '7 days streak', c: '#FB7185', ring: 'rgb(44,47,55)' }, theirs),
      Object.assign({ name: 'Ben', note: 'gn all', c: '#60A5FA', ring: 'rgb(44,47,55)' }, theirs)
    ];
    const T = (name, c, line, opts) => Object.assign({ name: name, c: c, line: line, active: false, unread: false, ring: 'transparent' }, opts || {});
    const threads = [
      T('Bea', '#2DD4BF', 'Sent a Cheer sticker · 14m', { active: true, unread: true, ring: 'rgb(45,212,191)' }),
      T('Sam', '#A78BFA', 'You: proud of that streak! · 5h', { active: true }),
      T('Ana', '#FB7185', 'Replied to your story · 1d', { unread: true }),
      T('Ben', '#60A5FA', 'haha same, bed by 10 · 2d'),
      T('Kai', '#FBBF24', 'You: Sent a Rest up sticker · 4d'),
      T('Leo', '#FB923C', 'Seen · 1w')
    ].map((t) => Object.assign(t, {
      weight: t.unread ? 700 : 500,
      lineColor: t.unread ? 'rgb(245,245,244)' : 'rgb(155,157,166)',
      lineWeight: t.unread ? 600 : 400,
      label: 'Chat with ' + t.name + (t.unread ? ', unread' : ''),
      stickerLabel: 'Send ' + t.name + ' a sticker'
    }));
    return { notes: notes, threads: threads };
  }
}
</script>
</body>
</html>
