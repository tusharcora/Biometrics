<html lang="en">
<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244)}
.b:active{transform:translateY(1px);filter:brightness(.9)}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;font-size:15px;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.55)"></div>

  <div style="position: absolute; top: 150px; left: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
    <div role="toolbar" aria-label="React" style="display: flex; gap: 4px; padding: 6px; border-radius: 24px; background: rgb(28,31,38); border: 1px solid rgb(44,47,55)">
      <button class="b" aria-label="React Cheer" style="width: 36px; height: 36px; border-radius: 18px; color: #FBBF24"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l5-14 9 9z"></path><path d="M14 4l1-2M19 9l2-1M17 5l2-2"></path></svg></button>
      <button class="b" aria-label="React Heart" style="width: 36px; height: 36px; border-radius: 18px; color: #FB7185"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
      <button class="b" aria-label="React Rest up" style="width: 36px; height: 36px; border-radius: 18px; color: #A5B4FC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></button>
      <button class="b" aria-label="React Star" style="width: 36px; height: 36px; border-radius: 18px; color: #FDE68A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4l-5.2 2.8 1-5.9L3.5 9.2l5.9-.8z"></path></svg></button>
    </div>
    <div style="max-width: 260px; padding: 9px 13px; border-radius: 18px 18px 18px 6px; background: rgb(38,41,49); font-size: 15px; line-height: 20px">[a message from Bea]</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 36px; border-radius: 38px 38px 0 0; background: rgb(20,22,27); border-top: 1px solid rgb(44,47,55); display: flex; flex-direction: column; gap: 6px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); margin-bottom: 8px"></div>
    <div style="font-size: 20px; font-weight: 700">Report message</div>
    <div style="font-size: 14px; line-height: 20px; color: rgb(155,157,166); margin-bottom: 6px">Bea won't be told. Reports are kept for review.</div>
    <div role="radiogroup" aria-label="Reason" style="display: flex; flex-direction: column">
      <label class="opt"><input type="radio" name="reason" checked="{{ true }}" style="width: 18px; height: 18px; accent-color: rgb(245,245,244)">Spam</label>
      <label class="opt"><input type="radio" name="reason" style="width: 18px; height: 18px; accent-color: rgb(245,245,244)">Harassment</label>
      <label class="opt"><input type="radio" name="reason" style="width: 18px; height: 18px; accent-color: rgb(245,245,244)">Something else</label>
    </div>
    <label class="opt" style="border-top: 1px solid rgb(34,37,44); margin-top: 4px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: rgb(248,113,113)">Also block Bea</label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px">
      <button class="b" style="height: 40px; border-color: rgb(44,47,55); background: rgba(44,47,55,.3); font-size: 14px">Cancel</button>
      <button class="b" style="height: 40px; background: rgba(248,113,113,.2); color: rgb(248,113,113); font-size: 14px">Report</button>
    </div>
  </div>
</div>
