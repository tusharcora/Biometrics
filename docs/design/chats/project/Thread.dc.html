<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat thread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif;font-weight:500;white-space:nowrap;cursor:pointer;gap:6px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgb(245,245,244)}
.b:active{transform:translateY(1px);filter:brightness(.9)}
.px{font-family:'Silkscreen',monospace}
input::placeholder{color:rgb(155,157,166)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: rgb(10,11,14); color: rgb(245,245,244); font-family: 'Geist', system-ui, sans-serif">
  <div style="position: absolute; top: 48px; left: 0; right: 0; height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgb(34,37,44)">
    <button class="b" aria-label="Back to chats" style="width: 36px; height: 36px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="position: relative; width: 36px; height: 36px; border-radius: 18px; background: rgb(20,22,27); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="3" y="2" width="6" height="1" fill="#2DD4BF"></rect><rect x="2" y="3" width="8" height="6" fill="#2DD4BF"></rect><rect x="3" y="9" width="6" height="1" fill="#2DD4BF"></rect><rect x="4" y="5" width="1" height="2" fill="#14161B"></rect><rect x="7" y="5" width="1" height="2" fill="#14161B"></rect></svg>
      <span style="position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 6px; background: rgb(74,222,128); border: 2px solid rgb(10,11,14)"></span>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 700">Bea</div>
      <div style="font-size: 12px; color: rgb(155,157,166)">Active now</div>
    </div>
    <button class="b" aria-label="Bea's week" style="width: 36px; height: 36px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
    </button>
  </div>

  <div style="position: absolute; top: 116px; left: 0; right: 0; bottom: 170px; padding: 0 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="align-self: center; margin: 4px 0 8px; padding: 3px 10px; border-radius: 10px; background: rgb(28,31,38); font-size: 11.5px; color: rgb(155,157,166)">Yesterday 10:42 PM</div>

    <div style="align-self: flex-start; max-width: 250px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 11.5px; color: rgb(155,157,166); padding-left: 4px">Replied to your story</div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid rgb(44,47,55); background: rgb(20,22,27)">
        <div style="width: 40px; height: 54px; border-radius: 8px; background: rgb(15,18,48); display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
        </div>
        <div style="font-size: 13px; line-height: 18px; color: rgb(155,157,166)">You said goodnight,<br><span style="color: rgb(245,245,244)">on time</span></div>
      </div>
      <div style="padding: 9px 13px; border-radius: 18px 18px 18px 6px; background: rgb(38,41,49); font-size: 15px; line-height: 20px">look at you going to bed early</div>
    </div>

    <div style="align-self: flex-end; max-width: 250px; position: relative; margin-bottom: 10px">
      <div style="padding: 9px 13px; border-radius: 18px 18px 6px 18px; background: rgb(45,212,191); color: #04211D; font-size: 15px; line-height: 20px">trying to keep the fire lit this week</div>
      <div aria-label="Bea reacted Cheer" style="position: absolute; right: 8px; bottom: -12px; padding: 2px 7px; border-radius: 10px; background: rgb(28,31,38); border: 2px solid rgb(10,11,14); font-size: 11px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l5-14 9 9z"></path><path d="M14 4l1-2M19 9l2-1M17 5l2-2"></path></svg></div>
    </div>

    <div style="align-self: center; margin: 10px 0 6px; padding: 3px 10px; border-radius: 10px; background: rgb(28,31,38); font-size: 11.5px; color: rgb(155,157,166)">Today 7:05 AM</div>

    <div style="align-self: flex-start; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 14px; border-radius: 16px; background: rgb(20,22,27); border: 1px solid rgb(34,37,44)">
      <div style="color: #FBBF24"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l5-14 9 9z"></path><path d="M14 4l1-2M19 9l2-1M17 5l2-2"></path></svg></div>
      <div class="px" style="font-size: 9px; letter-spacing: 1px; color: rgb(155,157,166)">CHEER</div>
    </div>

    <div style="align-self: flex-end; max-width: 250px">
      <div style="padding: 9px 13px; border-radius: 18px 18px 6px 18px; background: rgb(45,212,191); color: #04211D; font-size: 15px; line-height: 20px">thanks! same time tonight?</div>
    </div>
    <div style="align-self: flex-end; font-size: 11.5px; color: rgb(155,157,166); padding-right: 4px">Seen</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 34px; background: rgb(10,11,14); border-top: 1px solid rgb(34,37,44); display: flex; flex-direction: column; gap: 10px">
    <div role="group" aria-label="Quick stickers" style="display: flex; gap: 8px">
      <button class="b" style="height: 32px; padding: 0 12px; border-radius: 999px; border-color: rgb(44,47,55); background: rgba(44,47,55,.3); font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l5-14 9 9z"></path><path d="M14 4l1-2M19 9l2-1M17 5l2-2"></path></svg>Cheer</button>
      <button class="b" style="height: 32px; padding: 0 12px; border-radius: 999px; border-color: rgb(44,47,55); background: rgba(44,47,55,.3); font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Heart</button>
      <button class="b" style="height: 32px; padding: 0 12px; border-radius: 999px; border-color: rgb(44,47,55); background: rgba(44,47,55,.3); font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>Rest up</button>
      <button class="b" style="height: 32px; padding: 0 12px; border-radius: 999px; border-color: rgb(44,47,55); background: rgba(44,47,55,.3); font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4l-5.2 2.8 1-5.9L3.5 9.2l5.9-.8z"></path></svg>Star</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button class="b" aria-label="Share your check-in" style="width: 36px; height: 36px; background: rgb(28,31,38)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <label style="flex: 1; height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 20px; background: rgb(28,31,38)">
        <input aria-label="Message" placeholder="Message…" style="flex: 1; border: 0; outline: none; background: transparent; color: rgb(245,245,244); font-family: inherit; font-size: 15px">
      </label>
      <button class="b" aria-label="Send" style="width: 36px; height: 36px; background: rgb(245,245,244); color: rgb(10,11,14)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
